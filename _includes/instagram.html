{% if site.data.instagram.enabled %}
<!-- Instagram feed. Tiles are filled in by ttu.js from Behold's JSON feed;
     the section stays hidden until posts actually render, so a failed fetch
     shows nothing rather than an empty heading. -->
<section id="instagram"
         class="instagram is-loading"
         data-feed="{{ site.data.instagram.feed_id }}"
         data-count="{{ site.data.instagram.post_count | default: 3 }}">
  <div class="container">

    <div class="instagram-head">
      <h2>{{ site.data.content.instagram-heading }}</h2>

    </div>

    <div class="instagram-grid" id="instagram-grid"></div>

    <div class="instagram-actions">
      <a class="btn-ttu-inverse" href="{{ site.data.instagram.profile_url }}" target="_blank" rel="noopener">
        {{ site.data.content.instagram-cta }}
      </a>
    </div>

  </div>
</section>
{% endif %}
